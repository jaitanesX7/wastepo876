[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    # Allow camera access for in-browser computer vision on Netlify HTTPS domain
    Permissions-Policy = "camera=(self)"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"
